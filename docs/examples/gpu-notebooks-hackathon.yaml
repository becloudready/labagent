# One command instead of a page of flags:
#   export SHADEFORM_SSH_KEY_ID=<id of the key in your Shadeform account>
#   labagent launch -f docs/examples/gpu-notebooks-hackathon.yaml --dry-run
#   labagent launch -f docs/examples/gpu-notebooks-hackathon.yaml
#   labagent destroy -f docs/examples/gpu-notebooks-hackathon.yaml
# Flags win over this file: add --param hours=2 to try a shorter run without editing it.
description: JupyterLab per H100 slice for a two-hour workshop
pack: gpu-notebooks
name: nvidia-h100-workshop          # also the host name of the VM, so it shows in every prompt and screenshot
params:
  cloud: shadeform
  vendor: scaleway
  region: paris-france-1
  os: ubuntu24.04_cuda13.0_shade_os
  ssh_key_id: ${SHADEFORM_SSH_KEY_ID}
  hours: 4                          # the cloud deletes the VM after this, whatever happens to your laptop
  profile: 1g.10gb                  # 7 labs per H100
  login_user: labagent
  login_sudo: false                 # true is root: one student could read every lab's token
