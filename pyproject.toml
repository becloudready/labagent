[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "labagent"
dynamic = ["version"]
description = "Open-source CLI and AI agent to launch and tear down hands-on labs for RAG, LLM and Databricks, plus AWS and Terraform sandboxes."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "BeCloudReady" }]
keywords = ["hands-on-labs", "rag", "llm", "databricks", "lakebase", "pgvector", "text-to-sql", "ollama", "ai-agent", "aws", "terraform", "training", "workshop", "sandbox", "cleanup", "iam", "boto3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]
dependencies = ["boto3>=1.34", "cryptography>=42"]

[project.optional-dependencies]
rag = ["psycopg[binary]>=3.1"]
rag-local = ["pydantic>=2", "chromadb>=0.5", "sentence-transformers>=3", "streamlit>=1.35", "pypdf>=4"]
modal = ["modal>=1.0"]
aml = ["openpyxl>=3.1", "python-docx>=1.1", "pyarrow>=15"]
rag-lab = ["pydantic>=2", "chromadb>=0.5", "sentence-transformers>=3", "streamlit>=1.35", "pypdf>=4", "groq>=0.9", "langchain>=0.3", "qdrant-client>=1.9", "jupyterlab>=4", "ipykernel>=6"]
dev = ["pytest>=8", "pydantic>=2", "moto[all]>=5", "build>=1.2", "twine>=5", "openpyxl>=3.1", "python-docx>=1.1"]

[project.urls]
Homepage = "https://github.com/becloudready/labagent"
Source = "https://github.com/becloudready/labagent"
Issues = "https://github.com/becloudready/labagent/issues"
Documentation = "https://github.com/becloudready/labagent/tree/main/docs"

[project.scripts]
labagent = "labagent.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["labagent*"]

[tool.setuptools.dynamic]
version = { attr = "labagent.__version__" }

[tool.setuptools.package-data]
labagent = [
  "terraform/*/*.tf",
  "terraform/*/*.tftpl",
  "terraform/*/.terraform.lock.hcl",
  "terraform/*/tests/*.tftest.hcl",
  "packs/*/sources/*.json",
  "packs/aml/data/*.json",
  "packs/*/app/*",
  "packs/*/app/static/*",
  "packs/*/tutorial/notebooks/*.py",
  "packs/*/sql/*/*.sql",
  "packs/*/guides/*.md",
  "ai/rag/lab/docs/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
