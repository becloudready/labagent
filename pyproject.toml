[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "labagent"
dynamic = ["version"]
description = "Open-source CLI and AI agent to launch and tear down hands-on labs for RAG, LLM and Databricks, plus AWS and Terraform sandboxes."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "BeCloudReady" }]
keywords = ["hands-on-labs", "rag", "llm", "databricks", "lakebase", "pgvector", "text-to-sql", "ollama", "ai-agent", "aws", "terraform", "training", "workshop", "sandbox", "cleanup", "iam", "boto3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]
dependencies = ["boto3>=1.34", "cryptography>=42"]

[project.optional-dependencies]
rag = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "moto[all]>=5", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://github.com/becloudready/labagent"
Source = "https://github.com/becloudready/labagent"
Issues = "https://github.com/becloudready/labagent/issues"
Documentation = "https://github.com/becloudready/labagent/tree/main/docs"

[project.scripts]
labagent = "labagent.cli:main"
labctl = "labagent.cli:main"   # deprecated alias from before the rename

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["labagent*"]

[tool.setuptools.dynamic]
version = { attr = "labagent.__version__" }

[tool.setuptools.package-data]
labagent = [
  "terraform/*/*.tf",
  "terraform/*/*.tftpl",
  "terraform/*/.terraform.lock.hcl",
  "terraform/*/tests/*.tftest.hcl",
  "packs/*/sources/*.jsonl",
  "packs/*/sources/*.json",
  "packs/*/app/*",
  "packs/*/app/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
